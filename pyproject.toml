[project]
name = "couscous"
version = "0.1.0"
description = "Leitor de feeds RSS"
authors = [
    {name = "Hildeberto", email = "hildeberto@gmail.com"},
]
requires-python = "<3.14,>=3.13"
dependencies = [
    "authlib>=1.5.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "flet[all]>=0.85.2",
    "sqlalchemy<3.0.0,>=2.0.50",
    "python-dotenv<2.0.0,>=1.2.2",
    "sqlmodel<1.0.0,>=0.0.38",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "fletify@git+https://github.com/Benitmulindwa/FletifyHTML.git",
    "starlette>=1.3.1",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "msgpack>=1.2.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "behave<2.0.0,>=1.3.3",
    "mypy>=2.1.0",
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "bandit>=1.9.4",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "database*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.mypy]  # https://mypy.readthedocs.io/en/latest/config_file.html
python_version = "3.13"
junit_xml = "reports/mypy.xml"
files = ["app", "database"]
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
check_untyped_defs = true

[tool.ruff]  # https://docs.astral.sh/ruff/settings/
fix = false
line-length = 88
indent-width = 4
src = ["."]
extend-exclude = ["tests"]

[tool.ruff.format]
preview = true
indent-style = "space"
docstring-code-format = true
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "A", "AIR", "ASYNC", "B", "C4", "C90", "COM",
    "DTZ", "E", "EM", "ERA", "EXE", "F", "FA",
    "FAST", "FBT", "FIX", "FLY", "FURB", "G", "I",
    "ICN", "INP", "INT", "ISC",
    "LOG", "N", "NPY", "PD", "PERF", "PGH",
    "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH",
    "PYI", "Q", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "SLOT", "TC", "TD", "TID",
    "TRY", "UP", "W", "YTT"
]
ignore = [
    "COM812", "D", "E701", "G004",
    "PLC0415", "RUF100",
]

[tool.pytest.ini_options]
# modo automático para testes assíncronos
asyncio_mode = "auto"
# Adiciona o diretório raiz ao PYTHONPATH
pythonpath = ["."]
# Cobetura de testes no app
addopts = ["-v", "--cov=app", "--cov-report=term-missing"]
