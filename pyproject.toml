[project]
authors = [
    {name = "Hildeberto", email = "hildeberto@gmail.com"},
]
requires-python = "<3.14,>=3.13"
dependencies = [
    "flet>=0.85.0",
    "sqlalchemy<3.0.0,>=2.0.35",
    "python-dotenv<2.0.0,>=1.0.1",
    "sqlmodel<1.0.0,>=0.0.22",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
]
name = "couscous"
version = "0.1.0"
description = "Leitor de feeds RSS"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "behave<2.0.0,>=1.2.6",
    "mypy>=1.19.0",
    "pytest<9.0.0,>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.15",
    "bandit>=1.8.0",
]

[tool.setuptools.packages.find]
include = ["app*", "database*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.mypy]  # https://mypy.readthedocs.io/en/latest/config_file.html
python_version = "3.13"
junit_xml = "reports/mypy.xml"
files = ["app", "database"]
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
check_untyped_defs = true

[tool.ruff]  # https://docs.astral.sh/ruff/settings/
fix = false
line-length = 88
indent-width = 4
src = ["."]
extend-exclude = ["tests"]

[tool.ruff.format]
preview = true
indent-style = "space"
docstring-code-format = true
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "A", "AIR", "ASYNC", "B", "C4", "C90", "COM",
    "DTZ", "E", "EM", "ERA", "EXE", "F", "FA",
    "FAST", "FBT", "FIX", "FLY", "FURB", "G", "I",
    "ICN", "INP", "INT", "ISC",
    "LOG", "N", "NPY", "PD", "PERF", "PGH",
    "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH",
    "PYI", "Q", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "SLOT", "TC", "TD", "TID",
    "TRY", "UP", "W", "YTT"
]
ignore = [
    "COM812", "D", "E701", "G004",
    "PLC0415", "RUF100",
]
